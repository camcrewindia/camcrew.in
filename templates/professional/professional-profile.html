<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Profile | CamCrew</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/static/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  :root { --ac: #00dbe9; --ac2: #ebb2ff; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
      background: #0A0A0B;
      background-image: radial-gradient(circle at top right, rgba(0,219,233,0.03), transparent 40%), radial-gradient(circle at bottom left, rgba(235,178,255,0.03), transparent 40%);
      background-attachment: fixed;
    color: #dce4e5;
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── Page wrapper ── */
  .page-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1rem 5rem;
  }

  /* ══════════════════════════════════════
     COVER BANNER
  ══════════════════════════════════════ */
  .profile-banner { position: relative; height: 200px; background: rgba(0,0,0,0.3); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); overflow: hidden; border-radius: 0 0 1.25rem 1.25rem; }

  @media (min-width: 640px) { .profile-banner { position: relative; height: 200px; background: rgba(0,0,0,0.3); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); overflow: hidden; border-radius: 0 0 1.25rem 1.25rem; } }

  .banner-lines {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,219,233,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,219,233,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .banner-glow-left {
    position: absolute; top: -60px; left: -60px;
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,219,233,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .banner-glow-right {
    position: absolute; bottom: -80px; right: -40px;
    width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(235,178,255,0.10) 0%, transparent 70%);
    pointer-events: none;
  }

  .banner-actions {
    position: absolute; top: 1rem; right: 1rem;
    display: flex; gap: 0.5rem;
  }

  /* ══════════════════════════════════════
     PROFILE IDENTITY BLOCK
  ══════════════════════════════════════ */
  .identity-block {
    position: relative;
    padding: 0 1.5rem 1.5rem;
    margin-bottom: 1.5rem;
  }

  .avatar-positioner {
    display: flex;
    align-items: flex-end;
    gap: 1.25rem;
    margin-top: -48px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  @media (min-width: 540px) { .avatar-positioner { margin-top: -56px; } }

  .avatar-ring {
    width: 104px; height: 104px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00dbe9, #ebb2ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem; font-weight: 900; color: #001f22;
    border: 3px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 0 1px rgba(0,219,233,0.3), 0 8px 32px rgba(0,0,0,0.6);
    overflow: hidden; position: relative; flex-shrink: 0;
    transform: none !important; animation: none !important;
  }

  @media (min-width: 540px) {
    .avatar-ring { width: 120px; height: 120px; font-size: 3rem; }
  }

  .avatar-ring img, .avatar-ring span {
    transform: none !important; animation: none !important;
  }

  .avatar-ring img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0; border-radius: 50%;
  }

  .avatar-actions {
    display: flex; gap: 0.5rem; flex-wrap: wrap;
    align-items: center; padding-bottom: 0.5rem;
    margin-left: auto;
  }

  /* ── Identity text ── */
  .profile-name {
    font-size: 1.65rem; font-weight: 900; color: #f0f6f7;
    line-height: 1.15; margin-bottom: 0.2rem;
    letter-spacing: -0.02em;
  }

  @media (min-width: 540px) { .profile-name { font-size: 2rem; } }

  .profile-handle {
    font-size: 0.82rem; font-weight: 600; color: #556669;
    margin-bottom: 0.35rem; letter-spacing: 0.01em;
  }

  .profile-title {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.88rem; font-weight: 700; color: var(--ac);
    margin-bottom: 0.6rem;
  }

  .pro-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.2rem 0.6rem; border-radius: 999px;
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.07em;
    text-transform: uppercase;
    background: rgba(0,219,233,0.12);
    border: 1px solid rgba(0,219,233,0.3);
    color: var(--ac);
    vertical-align: middle;
  }

  .profile-bio {
    font-size: 0.88rem; color: #8fa8ab; line-height: 1.7;
    max-width: 520px; margin-bottom: 1rem;
    white-space: pre-wrap;
  }

  /* ── Meta row (website, member since, location) ── */
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 0.9rem;
    margin-bottom: 1rem; align-items: center;
  }

  .meta-item {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.8rem; font-weight: 600; color: #556669;
    text-decoration: none;
  }

  .meta-item.link { color: var(--ac); }
  .meta-item.link:hover { text-decoration: underline; }
  .meta-item .material-symbols-outlined { font-size: 0.95rem; }

  /* ── Category / location chips ── */
  .chips-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }

  .chip {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.3rem 0.8rem; border-radius: 999px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    background: rgba(0,219,233,0.08); color: #6fd8e0;
    border: 1px solid rgba(0,219,233,0.18);
    transition: border-color 0.2s;
  }
  .chip:hover { border-color: rgba(0,219,233,0.4); }

  .chip-location {
    background: rgba(235,178,255,0.08); color: #d9a8f5;
    border: 1px solid rgba(235,178,255,0.18);
  }
  .chip-location:hover { border-color: rgba(235,178,255,0.4); }

  /* ── Social links ── */
  .socials-row { display: flex; gap: 0.55rem; flex-wrap: wrap; margin-bottom: 0.5rem; }

  .social-link {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.35rem 0.9rem; border-radius: 0.6rem;
    font-size: 0.75rem; font-weight: 700;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #849495; text-decoration: none;
    transition: all 0.2s;
  }
  .social-link:hover {
    color: var(--ac);
    border-color: rgba(0,219,233,0.3);
    background: rgba(0,219,233,0.06);
  }
  .social-link .material-symbols-outlined { font-size: 0.95rem; }

  /* ══════════════════════════════════════
     STATS STRIP
  ══════════════════════════════════════ */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: rgba(255,255,255,0.06);
    border-radius: 1rem;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 2rem;
  }

  .stat-cell { padding: 1rem 1.25rem; border-radius: 1rem; background: rgba(22, 22, 24, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .stat-num {
    font-size: 1.5rem; font-weight: 900; color: #f0f6f7;
    line-height: 1; letter-spacing: -0.03em;
  }

  .stat-lbl {
    font-size: 0.68rem; font-weight: 700; color: #4a6466;
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* ══════════════════════════════════════
     ACTION BUTTONS
  ══════════════════════════════════════ */
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.6rem 1.35rem; border-radius: 0.75rem;
    font-size: 0.83rem; font-weight: 800; cursor: pointer; border: none;
    background: linear-gradient(135deg, #00dbe9, #00b5c0);
    color: #001f22; text-decoration: none;
    transition: all 0.2s; font-family: 'Plus Jakarta Sans', sans-serif;
    box-shadow: 0 4px 16px rgba(0,219,233,0.25);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,219,233,0.38); }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.58rem 1.15rem; border-radius: 0.75rem;
    font-size: 0.83rem; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: #b8cbce; text-decoration: none;
    transition: all 0.2s; font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.18);
    color: #dce4e5;
  }

  .btn-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.3rem; height: 2.3rem; border-radius: 0.65rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: #849495; cursor: pointer; text-decoration: none;
    transition: all 0.2s; font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: #dce4e5; }
  .btn-icon .material-symbols-outlined { font-size: 1rem; }

  /* ══════════════════════════════════════
     SECTION HEADINGS
  ══════════════════════════════════════ */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; margin: 2.5rem 0 1.25rem;
  }

  .section-title {
    font-size: 0.78rem; font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase; color: #556669;
    display: flex; align-items: center; gap: 0.6rem;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 3px; height: 14px; border-radius: 2px;
    background: linear-gradient(to bottom, var(--ac), var(--ac2));
    flex-shrink: 0;
  }

  /* ══════════════════════════════════════
     PORTFOLIO GRID
  ══════════════════════════════════════ */
  /* ── Portfolio Grid & Card System ── */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
  }

  .portfolio-card {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 1rem;
    overflow: visible;
    position: relative;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
  }

  .portfolio-card:hover {
    border-color: rgba(0, 240, 255, 0.3);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.1);
    transform: translateY(-3px);
  }

  .portfolio-media-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-top-left-radius: 1rem;
    border-top-right-radius: 1rem;
    background: rgba(0, 0, 0, 0.4);
    cursor: pointer;
  }

  .portfolio-media-wrap img,
  .portfolio-media-wrap video {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.4s ease;
  }

  .portfolio-card:hover .portfolio-media-wrap img,
  .portfolio-card:hover .portfolio-media-wrap video {
    transform: scale(1.06);
  }

  .manage-menu-btn {
    position: absolute;
    top: 0.6rem; right: 0.6rem;
    width: 2.2rem; height: 2.2rem;
    border-radius: 50%;
    background: rgba(11, 12, 16, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 20;
    transition: all 0.2s;
  }

  .manage-menu-btn:hover {
    background: #00f0ff;
    color: #0b0c10;
    border-color: #00f0ff;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
  }

  .manage-dropdown {
    position: absolute;
    top: 3.2rem; right: 0.6rem;
    width: 165px;
    background: rgba(18, 20, 26, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 0.75rem;
    padding: 0.35rem;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    z-index: 30;
    display: none;
    animation: menuFadeIn 0.15s ease-out;
  }

  .manage-dropdown.active {
    display: block;
  }

  @keyframes menuFadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .manage-item {
    display: flex; align-items: center; gap: 0.6rem;
    width: 100%; padding: 0.5rem 0.65rem;
    font-size: 0.78rem; font-weight: 600; color: #e2e8f0;
    background: transparent; border: none; border-radius: 0.5rem;
    cursor: pointer; transition: all 0.15s; text-align: left;
    font-family: inherit;
  }

  .manage-item:hover {
    background: rgba(0, 240, 255, 0.12);
    color: #00f0ff;
  }

  .manage-item.danger:hover {
    background: rgba(255, 77, 77, 0.15);
    color: #ff4d4d;
  }

  .manage-item .material-symbols-outlined {
    font-size: 1rem;
  }

  .portfolio-card-info {
    padding: 0.7rem 0.85rem;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255, 255, 255, 0.02);
    border-bottom-left-radius: 1rem;
    border-bottom-right-radius: 1rem;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }

  .portfolio-card-title {
    font-size: 0.82rem; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .portfolio-card-badge {
    font-size: 0.62rem; font-weight: 800; letter-spacing: 0.05em;
    padding: 0.15rem 0.45rem; border-radius: 0.35rem;
    background: rgba(0, 240, 255, 0.1); color: #00f0ff;
    border: 1px solid rgba(0, 240, 255, 0.2); text-transform: uppercase;
  }

  /* ── Empty state ── */
  .grid-empty {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.75rem; padding: 4rem 2rem; text-align: center;
    background: rgba(255,255,255,0.01);
  }

  .empty-icon-wrap {
    width: 4.5rem; height: 4.5rem; border-radius: 1.25rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 0.25rem;
  }

  /* ══════════════════════════════════════
     SERVICES GRID
  ══════════════════════════════════════ */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1rem;
  }

  .service-card { background: rgba(22, 22, 24, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; height: 100%; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
  .service-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--ac), var(--ac2));
    opacity: 0; transition: opacity 0.25s;
  }
  .service-card:hover { transform: translateY(-5px); border-color: rgba(0,219,233,0.4); background: rgba(30, 30, 34, 0.8); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .service-card:hover::before { opacity: 1; }

  .service-icon {
    width: 2.25rem; height: 2.25rem; border-radius: 0.65rem;
    background: rgba(0,219,233,0.1); border: 1px solid rgba(0,219,233,0.15);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 0.25rem;
  }
  .service-icon .material-symbols-outlined { font-size: 1.05rem; color: var(--ac); }

  .service-name { font-size: 0.92rem; font-weight: 800; color: #e0ebec; }
  .service-price {
    font-size: 0.8rem; font-weight: 700; color: var(--ac);
    display: inline-flex; align-items: center; gap: 0.25rem;
  }
  .service-desc { font-size: 0.78rem; color: #5a7a7d; line-height: 1.55; margin-top: 0.1rem; }

  /* ══════════════════════════════════════
     SHARE PROFILE CARD
  ══════════════════════════════════════ */
  .share-card {
    background: rgba(0,219,233,0.04);
    border: 1px solid rgba(0,219,233,0.12);
    border-radius: 1rem;
    padding: 1.4rem 1.6rem;
    display: flex; flex-direction: column; gap: 1rem;
  }

  .share-card-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
  }

  .share-title { font-size: 0.92rem; font-weight: 800; color: #dce4e5; margin-bottom: 0.2rem; }
  .share-sub   { font-size: 0.78rem; color: #4d666a; }

  .url-display {
    display: flex; align-items: center; gap: 0.5rem;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(0,219,233,0.12);
    border-radius: 0.65rem;
    padding: 0.6rem 0.9rem;
    overflow: hidden;
  }
  .url-display .material-symbols-outlined { font-size: 0.95rem; color: #4d666a; flex-shrink: 0; }
  .url-text {
    font-size: 0.8rem; color: var(--ac); font-weight: 700;
    font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ══════════════════════════════════════
     LIGHTBOX
  ══════════════════════════════════════ */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(0,0,0,0.94); backdrop-filter: blur(12px);
    display: none; align-items: center; justify-content: center;
    padding: 1rem;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-inner { position: relative; max-width: 860px; width: 100%; }
  .lightbox-inner img, .lightbox-inner video {
    width: 100%; max-height: 82vh; object-fit: contain; border-radius: 0.85rem;
    display: block;
  }
  .lightbox-close {
    position: absolute; top: -3rem; right: 0;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 0.5rem; color: #dce4e5; cursor: pointer;
    font-size: 1.25rem; display: flex; align-items: center; justify-content: center;
    width: 2.25rem; height: 2.25rem;
    transition: background 0.2s;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.14); }

  /* ══════════════════════════════════════
     TOAST
  ══════════════════════════════════════ */
  #pp-toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,20,0.96);
    border: 1px solid rgba(255,255,255,0.1);
    color: #dce4e5; border-radius: 999px; padding: 0.65rem 1.4rem;
    font-size: 0.82rem; font-weight: 700;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    z-index: 999999; opacity: 0; transition: opacity 0.25s;
    white-space: nowrap;
  }
  #pp-toast.show { opacity: 1; }

  /* ══════════════════════════════════════
     SKELETON
  ══════════════════════════════════════ */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.04; }
    50%       { opacity: 0.09; }
  }

  .skel { background: rgba(22, 22, 24, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); animation: skel-pulse 1.5s ease-in-out infinite; }

  .skel-banner { height: 200px; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); border-radius: 0 0 1.25rem 1.25rem; animation: skel-pulse 1.5s ease-in-out infinite; margin-bottom: 1.5rem; }

  /* ══════════════════════════════════════
     LIGHT MODE STYLES
  ══════════════════════════════════════ */
  [data-theme="light"] body,
  html.light body {
    background: #e0e5ec !important;
    color: #0f172a !important;
  }

  [data-theme="light"] .profile-banner,
  html.light .profile-banner {
    background: #cbd5e1 !important;
    border-bottom-color: rgba(0, 0, 0, 0.1) !important;
  }

  [data-theme="light"] .profile-name,
  [data-theme="light"] .section-title,
  [data-theme="light"] .stat-num,
  [data-theme="light"] .service-name,

<body>

<!-- ── CamCrew header ── -->
<div id="header-placeholder"></div>
<script src="/static/js/header-loader.js"></script>

<!-- ── Main ── -->
<main id="profile-root">

  <!-- Loading skeleton -->
  <div id="skeleton">
    <div class="skel-banner"></div>
    <div class="fixed inset-0 z-[-1] pointer-events-none"><div class="hero-grid absolute inset-0 opacity-15"></div><div class="orb-1"></div><div class="orb-2"></div></div>
    <div class="page-wrap relative z-10">
      <div style="display:flex;align-items:flex-end;gap:1.25rem;margin-top:-52px;margin-bottom:1.25rem;flex-wrap:wrap;">
        <div class="skel" style="width:110px;height:110px;border-radius:50%;flex-shrink:0;border:4px solid #0a0a0b;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:0.6rem;padding-bottom:0.5rem;">
          <div class="skel" style="height:1.8rem;max-width:200px;"></div>
          <div class="skel" style="height:0.9rem;max-width:140px;"></div>
        </div>
      </div>
      <div class="skel" style="height:3.5rem;border-radius:1rem;margin-bottom:2rem;"></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:1rem;overflow:hidden;">
        <div class="skel" style="aspect-ratio:1;"></div>
        <div class="skel" style="aspect-ratio:1;"></div>
        <div class="skel" style="aspect-ratio:1;"></div>
        <div class="skel" style="aspect-ratio:1;"></div>
        <div class="skel" style="aspect-ratio:1;"></div>
        <div class="skel" style="aspect-ratio:1;"></div>
      </div>
    </div>
  </div>

  <!-- Content (hidden until loaded) -->
  <div id="profile-content" style="display:none;"></div>

</main>

<!-- ── Lightbox ── -->
<div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
  <div class="lightbox-inner" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()">
      <span class="material-symbols-outlined">close</span>
    </button>
    <div id="lightbox-content"></div>
  </div>
</div>

<!-- ── Toast ── -->
<div id="pp-toast"></div>

<!-- ── Footer ── -->
<div id="footer-placeholder"></div>
<script src="/static/js/footer-loader.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   State & bootstrap
═══════════════════════════════════════════════════════════════════ */
const S = { user: null, pro: null, username: null };

(async function boot() {
  // Theme
  const theme = localStorage.getItem('cc-theme') || 'dark';
  document.documentElement.className = theme;

  // Load user from API
  try {
    const res  = await fetch('/api/me', { credentials: 'include' });
    const data = await res.json();
    if (data.ok) S.user = data.user;
  } catch (_) {}

  // Fetch fresh profile from server (PostgreSQL)
  try {
    const proRes = await fetch('/api/profile');
    const proData = await proRes.json();
    if (proData.ok && proData.profile) {
      S.pro = proData.profile;
      S.username = proData.profile.username || '';
    }
  } catch (_) {}

  // Load vault for portfolio count
  let vaultFiles = [];
  try {
    const v = JSON.parse(localStorage.getItem('pro_vault') || '{"files":[]}');
    vaultFiles = v.files || [];
  } catch (_) {}

  // Load jobs for completed count
  let jobs = [];
  try { jobs = JSON.parse(localStorage.getItem('pro_jobs') || '[]'); } catch (_) {}

  render(vaultFiles, jobs);
})();

/* ═══════════════════════════════════════════════════════════════════
   Render
═══════════════════════════════════════════════════════════════════ */
function render(vaultFiles, jobs) {
  const skeleton = document.getElementById('skeleton');
  const content  = document.getElementById('profile-content');

  const displayName  = S.user?.display_name || S.pro?.name || (S.user?.email?.split('@')[0]) || 'Professional';
  const title        = S.pro?.title        || '';
  const bio          = S.pro?.bio          || '';
  const categories   = S.pro?.categories   || [];
  const services     = S.pro?.services     || [];
  const locations    = S.pro?.locations    || [];
  const portfolio    = S.pro?.portfolio    || [];
  const socials      = S.pro?.socials      || {};
  const website      = S.pro?.website      || '';
  const joinedAt     = S.user?.created_at  || S.pro?.savedAt || '';

  const totalPortfolio = portfolio.length || vaultFiles.filter(f => ['image','video'].includes(f.type)).length;
  const completedJobs  = jobs.filter(j => j.status === 'completed').length;
  const initial        = displayName.charAt(0).toUpperCase();

  const avatarPhoto = S.pro?.avatar_url || S.pro?.avatarUrl || S.pro?.photo || S.user?.avatar_url || null;
  const avatarHTML  = avatarPhoto
    ? `<img src="${esc(avatarPhoto)}" alt="${esc(displayName)}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:2;border-radius:50%;" onerror="this.style.display='none';"/><span>${initial}</span>`
    : `<span>${initial}</span>`;

  const memberSince = joinedAt
    ? new Date(joinedAt).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
    : '';

  /* ─ Portfolio grid ─ */
  const allMedia  = portfolio.length ? portfolio : vaultFiles.filter(f => ['image','video'].includes(f.type));
  const gridCells = allMedia.length
    ? allMedia.map((item, i) => {
        const isVideo = item.file_type === 'video' || item.type === 'video' || item.isVideo;
        const url     = item.file_url || item.fileUrl || item.url || '';
        const title   = item.title || item.name || `Portfolio Item #${i+1}`;
        const itemId  = item.id || null;

        if (!url) {
          return `<div class="portfolio-card">
            <div class="portfolio-media-wrap">
              <div class="cell-placeholder">
                <span class="material-symbols-outlined" style="font-size:1.75rem;color:rgba(255,255,255,0.15);">${isVideo ? 'movie' : 'image'}</span>
              </div>
            </div>
          </div>`;
        }

        return `<div class="portfolio-card" id="portfolio-card-${i}">
          <div class="portfolio-media-wrap" onclick="openLightbox(${i})">
            ${isVideo
              ? `<video src="${esc(url)}" muted playsinline preload="metadata" onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0" onerror="this.parentElement.style.display='none'"></video>`
              : `<img src="${esc(url)}" alt="${esc(title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'cell-placeholder\\'><span class=\\'material-symbols-outlined\\' style=\\'font-size:1.75rem;color:rgba(255,255,255,0.15);\\'>image</span></div>'"/>`}
            <div class="cell-overlay">
              <div class="cell-overlay-icon">
                <span class="material-symbols-outlined">${isVideo ? 'play_arrow' : 'zoom_in'}</span>
              </div>
            </div>
          </div>

          <!-- 3-Dot Manage Button -->
          <button class="manage-menu-btn" title="Manage item" onclick="toggleManageMenu(${i}, event)">
            <span class="material-symbols-outlined" style="font-size:1.25rem;">more_vert</span>
          </button>

          <!-- Floating Dropdown Menu -->
          <div class="manage-dropdown" id="manage-menu-${i}">
            <button class="manage-item" onclick="openEditTitleModal('${itemId || ''}', '${esc(title).replace(/'/g, "\\'")}', ${i}, event)">
              <span class="material-symbols-outlined">edit</span> Change Name
            </button>
            <button class="manage-item" onclick="openLightbox(${i}); toggleManageMenu(${i}, event);">
              <span class="material-symbols-outlined">${isVideo ? 'play_circle' : 'visibility'}</span> Preview
            </button>
            <button class="manage-item" onclick="copyMediaLink('${esc(url)}', event); toggleManageMenu(${i}, event);">
              <span class="material-symbols-outlined">link</span> Copy Link
            </button>
            <button class="manage-item danger" onclick="deletePortfolioItem('${itemId || ''}', ${i}, event)">
              <span class="material-symbols-outlined">delete</span> Delete Image
            </button>
          </div>

          <div class="portfolio-card-info">
            <span class="portfolio-card-title">${esc(title)}</span>
            <span class="portfolio-card-badge">${isVideo ? 'VIDEO' : 'IMAGE'}</span>
          </div>
        </div>`;
      }).join('')
    : `<div class="grid-empty">
        <div class="empty-icon-wrap">
          <span class="material-symbols-outlined" style="font-size:1.75rem;color:rgba(255,255,255,0.15);">photo_library</span>
        </div>
        <p style="color:#4d666a;font-size:0.85rem;font-weight:600;">No portfolio items yet.</p>
        <a href="professional-edit.html" style="font-size:0.8rem;color:var(--ac);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;">
          Set up profile <span class="material-symbols-outlined" style="font-size:0.85rem;">arrow_forward</span>
        </a>
      </div>`;

  /* ─ Services ─ */
  const servicesHTML = services.length
    ? `<div class="services-grid">
        ${services.map(s => `
          <div class="service-card">
            <div class="service-icon">
              <span class="material-symbols-outlined">camera</span>
            </div>
            <p class="service-name">${esc(s.name)}</p>
            ${s.price ? `<p class="service-price"><span class="material-symbols-outlined" style="font-size:0.8rem;">currency_rupee</span>${fmtPrice(s)}</p>` : ''}
            ${s.desc  ? `<p class="service-desc">${esc(s.desc)}</p>` : ''}
          </div>`).join('')}
       </div>`
    : `<div style="padding:2rem 0;text-align:center;">
        <p style="color:#4d666a;font-size:0.85rem;font-weight:600;">No services listed yet.</p>
        <a href="professional-edit.html" style="font-size:0.8rem;color:var(--ac);font-weight:700;text-decoration:none;">Add services →</a>
       </div>`;

  /* ─ Social links ─ */
  const socialDefs = [
    { key: 'instagram', icon: 'camera_alt',  label: 'Instagram', prefix: 'https://instagram.com/' },
    { key: 'facebook',  icon: 'thumb_up',    label: 'Facebook',  prefix: 'https://facebook.com/'  },
    { key: 'tiktok',    icon: 'music_video', label: 'TikTok',    prefix: 'https://tiktok.com/@'   },
  ];
  const socialsHTML = socialDefs
    .filter(d => socials[d.key])
    .map(d => `
      <a href="${socials[d.key].startsWith('http') ? esc(socials[d.key]) : esc(d.prefix + socials[d.key])}"
         target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="material-symbols-outlined">${d.icon}</span>${d.label}
      </a>`).join('');

  /* ─ Meta row items ─ */
  const metaItems = [];
  if (website) {
    const cleanUrl = website.startsWith('http') ? website : 'https://' + website;
    metaItems.push(`<a href="${esc(cleanUrl)}" target="_blank" rel="noopener noreferrer" class="meta-item link">
      <span class="material-symbols-outlined">link</span>
      ${esc(website.replace(/^https?:\/\//, ''))}
    </a>`);
  }
  if (memberSince) {
    metaItems.push(`<span class="meta-item">
      <span class="material-symbols-outlined">calendar_month</span>
      Joined ${memberSince}
    </span>`);
  }

  /* ─ Render ─ */
  content.innerHTML = `
    <!-- Cover Banner -->
    <div class="profile-banner">
      <div class="banner-lines"></div>
      <div class="banner-glow-left"></div>
      <div class="banner-glow-right"></div>
      
    </div>

    <!-- Identity Block -->
    <div class="fixed inset-0 z-[-1] pointer-events-none"><div class="hero-grid absolute inset-0 opacity-15"></div><div class="orb-1"></div><div class="orb-2"></div></div>
    <div class="page-wrap relative z-10">
      <div class="identity-block">
        <!-- Avatar row -->
        <div class="avatar-positioner">
          <div class="avatar-ring">${avatarHTML}</div>
          <div class="avatar-actions">
              <a href="index.html" class="btn-ghost" style="font-size:0.78rem;padding:0.45rem 0.9rem;" title="Go to Home">
                <span class="material-symbols-outlined" style="font-size:0.88rem;">home</span>
                Home
              </a>
              <a href="professional-dashboard.html" class="btn-primary" style="padding:0.45rem 0.9rem;font-size:0.78rem;">
                <span class="material-symbols-outlined" style="font-size:0.88rem;">dashboard</span>
                Dashboard
              </a>
              <a href="professional-edit.html" class="btn-ghost" style="font-size:0.78rem;padding:0.45rem 0.9rem;">
                <span class="material-symbols-outlined" style="font-size:0.88rem;">edit</span>
                Edit Profile
              </a>
            </div>
          </div>

        <!-- Name & title -->
        <h1 class="profile-name">
          ${esc(displayName)}
          <span class="pro-badge" style="font-size:0.58rem;vertical-align:middle;margin-left:0.5rem;">
            <span class="material-symbols-outlined" style="font-size:0.7rem;fill:1;">verified</span>
            Pro
          </span>
        </h1>
        ${S.username ? `<p class="profile-handle">@${esc(S.username)}</p>` : ''}
        ${title ? `<p class="profile-title">
          <span class="material-symbols-outlined" style="font-size:0.95rem;">photo_camera</span>
          ${esc(title)}
        </p>` : ''}

        ${bio ? `<p class="profile-bio">${esc(bio)}</p>` : ''}

        ${metaItems.length ? `<div class="meta-row">${metaItems.join('')}</div>` : ''}

        ${categories.length ? `<div class="chips-row">
          ${categories.map(c => `<span class="chip">${esc(c)}</span>`).join('')}
        </div>` : ''}

        ${locations.length ? `<div class="chips-row">
          ${locations.map(l => `<span class="chip chip-location">
            <span class="material-symbols-outlined" style="font-size:0.75rem;">location_on</span>${esc(l)}
          </span>`).join('')}
        </div>` : ''}

        ${socialsHTML ? `<div class="socials-row">${socialsHTML}</div>` : ''}
      </div>

      <!-- Stats Strip -->
      <div class="stats-strip">
        <div class="stat-cell">
          <span class="stat-num">${totalPortfolio}</span>
          <span class="stat-lbl">Portfolio</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${services.length}</span>
          <span class="stat-lbl">Services</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${completedJobs}</span>
          <span class="stat-lbl">Completed</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${locations.length}</span>
          <span class="stat-lbl">Cities</span>
        </div>
      </div>

      <!-- Portfolio -->
      <div class="section-head">
        <h2 class="section-title">Portfolio</h2>
        ${allMedia.length ? `<span style="font-size:0.75rem;color:#4d666a;font-weight:600;">${allMedia.length} item${allMedia.length !== 1 ? 's' : ''}</span>` : ''}
      </div>
      <div class="portfolio-grid" id="portfolio-grid">${gridCells}</div>

      <!-- Services -->
      <div class="section-head">
        <h2 class="section-title">Services</h2>
      </div>
      ${servicesHTML}

      <!-- Share Profile -->
      <div class="section-head">
        <h2 class="section-title">Share Profile</h2>
      </div>
      <div class="share-card">
        <div class="share-card-top">
          <div>
            <p class="share-title">Your public profile link</p>
            <p class="share-sub">Share with clients — no login required to view.</p>
          </div>
          <button onclick="copyProfileLink()" style="
            display:inline-flex;align-items:center;gap:0.45rem;
            padding:0.55rem 1.15rem;border-radius:0.7rem;border:none;cursor:pointer;
            background:rgba(0,219,233,0.14);color:var(--ac);font-weight:800;font-size:0.8rem;
            font-family:'Plus Jakarta Sans',sans-serif;transition:background 0.2s;flex-shrink:0;"
            onmouseover="this.style.background='rgba(0,219,233,0.24)'"
            onmouseout="this.style.background='rgba(0,219,233,0.14)'">
            <span class="material-symbols-outlined" style="font-size:0.95rem;">content_copy</span>
            Copy Link
          </button>
        </div>
        <div class="url-display">
          <span class="material-symbols-outlined">link</span>
          <span class="url-text">${esc(S.username ? (window.location.origin + '/@' + S.username) : (window.location.origin + '/public-profile.html' + ((S.pro?.user_id || S.user?.id) ? '?id=' + (S.pro?.user_id || S.user?.id) : '')))}</span>
        </div>
      </div>

    </div><!-- /page-wrap -->
  `;

  window._lightboxMedia = allMedia;
  skeleton.style.display = 'none';
  content.style.display  = 'block';
}

/* ═══════════════════════════════════════════════════════════════════
   Lightbox
═══════════════════════════════════════════════════════════════════ */
function openLightbox(idx) {
  const media = (window._lightboxMedia || [])[idx];
  if (!media || !media.url) return;
  const url = media.url;
  const isInstagram = url.includes('instagram.com');
  const isEmbed = url.includes('youtube.com/embed') || url.includes('player.vimeo.com') || isInstagram;
  const isVideo = media.type === 'video' || media.isVideo;
  const lb = document.getElementById('lightbox-content');
  if (isEmbed) {
    if (isInstagram) {
      // Instagram Reels are 9:16 vertical — use portrait aspect-ratio wrapper
      lb.innerHTML = `
        <div style="position:relative;width:min(340px,90vw);max-height:90vh;border-radius:0.85rem;overflow:hidden;">
          <iframe src="${esc(url)}" frameborder="0" scrolling="no"
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
            allowfullscreen
            style="position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:0.85rem;">
          </iframe>
          <div style="padding-top:177.78%;"></div>
        </div>`;
    } else {
      // YouTube / Vimeo — standard 16:9 landscape player
      lb.innerHTML = `
        <div style="position:relative;width:min(850px,90vw);border-radius:0.85rem;overflow:hidden;">
          <iframe src="${esc(url)}" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            style="position:absolute;inset:0;width:100%;height:100%;border:none;">
          </iframe>
          <div style="padding-top:56.25%;"></div>
        </div>`;
    }
  } else if (isVideo) {
    lb.innerHTML = `<video src="${esc(url)}" controls autoplay style="width:100%;max-height:82vh;border-radius:0.85rem;"></video>`;
  } else {
    lb.innerHTML = `<img src="${esc(url)}" alt="Portfolio" style="width:100%;max-height:82vh;object-fit:contain;border-radius:0.85rem;"/>`;
  }
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

/* ═══════════════════════════════════════════════════════════════════
   Copy profile link
═══════════════════════════════════════════════════════════════════ */
function copyProfileLink() {
  const url = S.username
    ? window.location.origin + '/@' + S.username
    : window.location.origin + '/public-profile.html' + ((S.pro?.user_id || S.user?.id) ? '?id=' + (S.pro?.user_id || S.user?.id) : '');
  navigator.clipboard.writeText(url)
    .then(() => showToast('Link copied to clipboard'))
    .catch(() => showToast('Could not copy link.'));
}

/* ═══════════════════════════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtPrice(s) {
  if (!s.price) return '';
  const unit = s.unit || 'project';
  const num  = Number(s.price).toLocaleString('en-IN');
  return `${num} / ${unit}`;
}

function showToast(msg) {
  const t = document.getElementById('pp-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function toggleTheme() {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  document.documentElement.className = next;
  localStorage.setItem('cc-theme', next);
}

/* ═══════════════════════════════════════════════════════════════════
   Portfolio Item Deletion & Title Editing Handlers
═══════════════════════════════════════════════════════════════════ */
function toggleManageMenu(index, event) {
  if (event) event.stopPropagation();
  const allMenus = document.querySelectorAll('.manage-dropdown');
  allMenus.forEach((m, idx) => {
    if (idx !== index) m.classList.remove('active');
  });
  const menu = document.getElementById(`manage-menu-${index}`);
  if (menu) menu.classList.toggle('active');
}

document.addEventListener('click', () => {
  document.querySelectorAll('.manage-dropdown').forEach(m => m.classList.remove('active'));
});

function copyMediaLink(url, event) {
  if (event) event.stopPropagation();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('Image link copied to clipboard!'));
  } else {
    showToast('Image link copied!');
  }
}

async function deletePortfolioItem(itemId, itemIndex, event) {
  if (event) event.stopPropagation();
  toggleManageMenu(itemIndex, event);
  if (!confirm('Are you sure you want to delete this portfolio item?')) return;

  const card = document.getElementById(`portfolio-card-${itemIndex}`);
  if (card) {
    card.style.opacity = '0.3';
    card.style.pointerEvents = 'none';
  }

  const media = (window._lightboxMedia || [])[itemIndex] || {};
  const targetId = itemId || media.id;
  const targetUrl = media.file_url || media.fileUrl || media.url;

  try {
    let res;
    if (targetId && String(targetId).match(/^\d+$/)) {
      res = await fetch(`/api/portfolio/${targetId}`, { method: 'DELETE' });
    } else if (targetUrl) {
      res = await fetch('/api/portfolio', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_url: targetUrl })
      });
    } else {
      throw new Error('Item identifier missing.');
    }

    const data = await res.json();
    if (data.ok) {
      if (card) card.remove();
      try { localStorage.removeItem('cc_pro_profile'); } catch(_) {}
      showToast('Portfolio item deleted successfully');
    } else {
      if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
      showToast(data.error || 'Failed to delete item');
    }
  } catch (err) {
    console.error('Delete portfolio error:', err);
    if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
    showToast('Failed to delete portfolio item');
  }
}

let _editingItem = null;

function openEditTitleModal(itemId, currentTitle, cardIndex, event) {
  if (event) event.stopPropagation();
  toggleManageMenu(cardIndex, event);
  _editingItem = { id: itemId, index: cardIndex };
  const input = document.getElementById('edit-title-input');
  if (input) input.value = currentTitle || '';
  const modal = document.getElementById('edit-title-modal');
  if (modal) modal.style.display = 'flex';
}

function closeEditTitleModal() {
  const modal = document.getElementById('edit-title-modal');
  if (modal) modal.style.display = 'none';
  _editingItem = null;
}

async function savePortfolioTitle() {
  if (!_editingItem) return;
  const input = document.getElementById('edit-title-input');
  const newTitle = input ? input.value.trim() : '';
  if (!newTitle) { showToast('Please enter a title'); return; }

  const btn = document.getElementById('save-title-btn');
  if (btn) btn.disabled = true;

  try {
    const res = await fetch(`/api/portfolio/${_editingItem.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: newTitle })
    });
    const data = await res.json();
    if (data.ok) {
      const titleEl = document.querySelector(`#portfolio-card-${_editingItem.index} .portfolio-card-title`);
      if (titleEl) titleEl.textContent = newTitle;
      showToast('Image name updated successfully!');
      closeEditTitleModal();
    } else {
      showToast(data.error || 'Failed to update title');
    }
  } catch (err) {
    console.error('Update title error:', err);
    showToast('Failed to update image name');
  } finally {
    if (btn) btn.disabled = false;
  }
}
</script>

  <div style="background:#12141a;border:1px solid rgba(255,255,255,0.15);border-radius:1rem;padding:1.5rem;width:90%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,0.8);">
