<!DOCTYPE html>
<html class="light" lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Profile | CamCrew</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/static/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  :root {
    --ac: #0e5a6f;
    --ac2: #0088a8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #e0e5ec;
    color: #0f172a;
    font-family: 'Google Sans', 'Product Sans', 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* ── Page wrapper ── */
  .page-wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 1.25rem 6rem;
  }

  /* ══════════════════════════════════════
     COVER BANNER (ELEGANT LIGHT & DARK)
  ══════════════════════════════════════ */
  .profile-banner {
    position: relative;
    height: 220px;
    background: linear-gradient(135deg, #0e5a6f 0%, #0088a8 60%, #0f172a 100%);
    overflow: hidden;
    border-radius: 0 0 1.75rem 1.75rem;
    box-shadow: 0 8px 24px rgba(14, 90, 111, 0.25);
  }

  .banner-lines {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .banner-glow-left {
    position: absolute; top: -80px; left: -80px;
    width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .banner-glow-right {
    position: absolute; bottom: -80px; right: -40px;
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(235, 178, 255, 0.2) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ══════════════════════════════════════
     PROFILE IDENTITY BLOCK
  ══════════════════════════════════════ */
  .identity-block {
    position: relative;
    padding: 0 1rem 1.5rem;
    margin-bottom: 2rem;
  }

  .avatar-positioner {
    display: flex;
    align-items: flex-end;
    gap: 1.25rem;
    margin-top: -60px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .avatar-ring {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0e5a6f, #0088a8);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; font-weight: 900; color: #ffffff;
    border: 4px solid #ffffff;
    box-shadow: 6px 6px 18px #b8c2cc, -6px -6px 18px #ffffff;
    overflow: hidden; position: relative; flex-shrink: 0;
  }

  .avatar-ring img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0; border-radius: 50%; z-index: 2;
  }

  .avatar-ring span {
    position: relative; z-index: 1; color: #ffffff; font-weight: 900;
  }

  .avatar-actions {
    display: flex; gap: 0.6rem; flex-wrap: wrap;
    align-items: center; padding-bottom: 0.5rem;
    margin-left: auto;
  }

  /* ── Identity text ── */
  .profile-name {
    font-size: 2rem; font-weight: 900; color: #0f172a;
    line-height: 1.15; margin-bottom: 0.25rem;
    letter-spacing: -0.02em;
  }

  .profile-handle {
    font-size: 0.88rem; font-weight: 700; color: #475569;
    margin-bottom: 0.4rem; letter-spacing: 0.01em;
  }

  .profile-title {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.95rem; font-weight: 800; color: #0e5a6f;
    margin-bottom: 0.75rem;
  }

  .pro-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.25rem 0.75rem; border-radius: 999px;
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.07em;
    text-transform: uppercase;
    background: rgba(14, 90, 111, 0.12);
    border: 1px solid rgba(14, 90, 111, 0.25);
    color: #0e5a6f;
    vertical-align: middle;
  }

  .profile-bio {
    font-size: 0.92rem; color: #334155; line-height: 1.75;
    max-width: 580px; margin-bottom: 1.25rem;
    white-space: pre-wrap; font-weight: 500;
  }

  /* ── Meta row (website, member since, location) ── */
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 1rem;
    margin-bottom: 1.25rem; align-items: center;
  }

  .meta-item {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.82rem; font-weight: 700; color: #475569;
    text-decoration: none;
  }

  .meta-item.link { color: #0e5a6f; }
  .meta-item.link:hover { text-decoration: underline; }
  .meta-item .material-symbols-outlined { font-size: 1rem; }

  /* ── Category / location chips ── */
  .chips-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }

  .chip {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.35rem 0.9rem; border-radius: 999px;
    font-size: 0.75rem; font-weight: 800; letter-spacing: 0.03em;
    background: #e0e5ec; color: #0e5a6f;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 3px 3px 8px #b8c2cc, -3px -3px 8px #ffffff;
    transition: all 0.2s;
  }

  .chip-location {
    color: #0284c7;
  }

  /* ── Social links ── */
  .socials-row { display: flex; gap: 0.65rem; flex-wrap: wrap; margin-bottom: 0.5rem; }

  .social-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.45rem 1rem; border-radius: 0.75rem;
    font-size: 0.78rem; font-weight: 800;
    background: #e0e5ec;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 3px 3px 8px #b8c2cc, -3px -3px 8px #ffffff;
    color: #334155; text-decoration: none;
    transition: all 0.2s;
  }
  .social-link:hover {
    color: #0e5a6f;
    box-shadow: 5px 5px 12px #b8c2cc, -5px -5px 12px #ffffff;
  }

  /* ══════════════════════════════════════
     STATS STRIP (ELEGANT NEUMORPHISM)
  ══════════════════════════════════════ */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  @media (min-width: 640px) {
    .stats-strip { grid-template-columns: repeat(4, 1fr); }
  }

  .stat-cell {
    padding: 1.25rem 1rem;
    border-radius: 1.25rem;
    background: #e0e5ec;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 5px 5px 14px #b8c2cc, -5px -5px 14px #ffffff;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .stat-num {
    font-size: 1.75rem; font-weight: 900; color: #0e5a6f;
    line-height: 1; letter-spacing: -0.03em; margin-bottom: 0.35rem;
  }

  .stat-lbl {
    font-size: 0.72rem; font-weight: 800; color: #475569;
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* ══════════════════════════════════════
     ACTION BUTTONS
  ══════════════════════════════════════ */
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.6rem 1.35rem; border-radius: 999px;
    font-size: 0.83rem; font-weight: 800; cursor: pointer; border: none;
    background: #0e5a6f;
    color: #ffffff; text-decoration: none;
    transition: all 0.2s; font-family: inherit;
    box-shadow: 0 4px 14px rgba(14, 90, 111, 0.35);
  }
  .btn-primary:hover {
    background: #0b3c49;
    box-shadow: 0 6px 18px rgba(14, 90, 111, 0.45);
    transform: translateY(-1px);
  }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.58rem 1.15rem; border-radius: 999px;
    font-size: 0.83rem; font-weight: 800; cursor: pointer;
    background: #e0e5ec;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 3px 3px 8px #b8c2cc, -3px -3px 8px #ffffff;
    color: #0f172a; text-decoration: none;
    transition: all 0.2s; font-family: inherit;
  }
  .btn-ghost:hover {
    color: #0e5a6f;
    box-shadow: 5px 5px 12px #b8c2cc, -5px -5px 12px #ffffff;
  }

  /* ══════════════════════════════════════
     SECTION HEADINGS
  ══════════════════════════════════════ */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; margin: 3rem 0 1.25rem;
  }

  .section-title {
    font-size: 0.88rem; font-weight: 900; letter-spacing: 0.12em;
    text-transform: uppercase; color: #0f172a;
    display: flex; align-items: center; gap: 0.6rem;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 4px; height: 16px; border-radius: 2px;
    background: #0e5a6f;
    flex-shrink: 0;
  }

  /* ══════════════════════════════════════
     PORTFOLIO GRID (NEUMORPHIC CARDS)
  ══════════════════════════════════════ */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1.25rem;
  }

  .portfolio-card {
    background: #e0e5ec;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 6px 6px 16px #b8c2cc, -6px -6px 16px #ffffff;
    border-radius: 1.25rem;
    overflow: visible;
    position: relative;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
  }

  .portfolio-card:hover {
    transform: translateY(-4px);
    box-shadow: 8px 8px 22px #b8c2cc, -8px -8px 22px #ffffff;
  }

  .portfolio-media-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-top-left-radius: 1.25rem;
    border-top-right-radius: 1.25rem;
    background: #cbd5e1;
    cursor: pointer;
  }

  .portfolio-media-wrap img,
  .portfolio-media-wrap video {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.4s ease;
  }

  .portfolio-card:hover .portfolio-media-wrap img,
  .portfolio-card:hover .portfolio-media-wrap video {
    transform: scale(1.06);
  }

  .manage-menu-btn {
    position: absolute;
    top: 0.6rem; right: 0.6rem;
    width: 2.2rem; height: 2.2rem;
    border-radius: 50%;
    background: rgba(225, 230, 236, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 0, 0, 0.1);
    color: #0f172a;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 20;
    transition: all 0.2s;
    box-shadow: 2px 2px 6px #b8c2cc;
  }

  .manage-menu-btn:hover {
    background: #0e5a6f;
    color: #ffffff;
    border-color: #0e5a6f;
  }

  .manage-dropdown {
    position: absolute;
    top: 3.2rem; right: 0.6rem;
    width: 165px;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 0.75rem;
    padding: 0.35rem;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
    z-index: 30;
    display: none;
  }

  .manage-dropdown.active { display: block; }

  .manage-item {
    display: flex; align-items: center; gap: 0.6rem;
    width: 100%; padding: 0.5rem 0.65rem;
    font-size: 0.78rem; font-weight: 700; color: #0f172a;
    background: transparent; border: none; border-radius: 0.5rem;
    cursor: pointer; transition: all 0.15s; text-align: left;
  }

  .manage-item:hover {
    background: rgba(14, 90, 111, 0.1);
    color: #0e5a6f;
  }

  .manage-item.danger:hover {
    background: rgba(225, 29, 72, 0.1);
    color: #e11d48;
  }

  .portfolio-card-info {
    padding: 0.85rem 1rem;
    display: flex; align-items: center; justify-content: space-between;
    background: #e0e5ec;
    border-bottom-left-radius: 1.25rem;
    border-bottom-right-radius: 1.25rem;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
  }

  .portfolio-card-title {
    font-size: 0.85rem; font-weight: 800; color: #0f172a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .portfolio-card-badge {
    font-size: 0.62rem; font-weight: 800; letter-spacing: 0.05em;
    padding: 0.2rem 0.5rem; border-radius: 0.4rem;
    background: rgba(14, 90, 111, 0.12); color: #0e5a6f;
    border: 1px solid rgba(14, 90, 111, 0.2); text-transform: uppercase;
  }

  /* ══════════════════════════════════════
     SERVICES GRID (NEUMORPHIC CARDS)
  ══════════════════════════════════════ */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1.25rem;
  }

  .service-card {
    background: #e0e5ec;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 6px 6px 16px #b8c2cc, -6px -6px 16px #ffffff;
    border-radius: 1.25rem; padding: 1.5rem;
    display: flex; flex-direction: column; height: 100%;
    transition: all 0.3s ease; cursor: pointer;
  }
  .service-card:hover {
    transform: translateY(-4px);
    box-shadow: 8px 8px 22px #b8c2cc, -8px -8px 22px #ffffff;
  }

  .service-icon {
    width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;
    background: rgba(14, 90, 111, 0.12); border: 1px solid rgba(14, 90, 111, 0.2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 0.5rem;
  }
  .service-icon .material-symbols-outlined { font-size: 1.15rem; color: #0e5a6f; }

  .service-name { font-size: 0.95rem; font-weight: 900; color: #0f172a; }
  .service-price {
    font-size: 0.85rem; font-weight: 800; color: #0e5a6f;
    display: inline-flex; align-items: center; gap: 0.25rem; margin-top: 0.2rem;
  }
  .service-desc { font-size: 0.8rem; color: #475569; line-height: 1.6; margin-top: 0.35rem; }

  /* ══════════════════════════════════════
     SHARE PROFILE CARD
  ══════════════════════════════════════ */
  .share-card {
    background: #e0e5ec;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: inset 4px 4px 10px #b8c2cc, inset -4px -4px 10px #ffffff;
    border-radius: 1.25rem;
    padding: 1.6rem;
    display: flex; flex-direction: column; gap: 1rem;
  }

  .share-title { font-size: 0.95rem; font-weight: 900; color: #0f172a; margin-bottom: 0.2rem; }
  .share-sub   { font-size: 0.8rem; color: #475569; }

  .url-display {
    display: flex; align-items: center; gap: 0.6rem;
    background: #e0e5ec;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: inset 2px 2px 6px #b8c2cc, inset -2px -2px 6px #ffffff;
    border-radius: 0.75rem;
    padding: 0.7rem 1rem;
    overflow: hidden;
  }
  .url-display .material-symbols-outlined { font-size: 1rem; color: #0e5a6f; flex-shrink: 0; }
  .url-text {
    font-size: 0.85rem; color: #0e5a6f; font-weight: 800;
    font-family: ui-monospace, 'Cascadia Code', monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ══════════════════════════════════════
     LIGHTBOX & TOAST
  ══════════════════════════════════════ */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(0,0,0,0.94); backdrop-filter: blur(12px);
    display: none; align-items: center; justify-content: center;
    padding: 1rem;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-inner { position: relative; max-width: 860px; width: 100%; }
  .lightbox-inner img, .lightbox-inner video {
    width: 100%; max-height: 82vh; object-fit: contain; border-radius: 0.85rem;
    display: block;
  }
  .lightbox-close {
    position: absolute; top: -3rem; right: 0;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 0.5rem; color: #ffffff; cursor: pointer;
    font-size: 1.25rem; display: flex; align-items: center; justify-content: center;
    width: 2.25rem; height: 2.25rem;
  }

  #pp-toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: #0f172a;
    color: #ffffff; border-radius: 999px; padding: 0.65rem 1.4rem;
    font-size: 0.82rem; font-weight: 800;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    z-index: 999999; opacity: 0; transition: opacity 0.25s;
    white-space: nowrap;
  }
  #pp-toast.show { opacity: 1; }

  /* ══════════════════════════════════════
     DARK THEME OVERRIDES (TOGGLEABLE)
  ══════════════════════════════════════ */
  [data-theme="dark"] body,
  html.dark body {
    background: #0A0A0B !important;
    color: #f8fafc !important;
  }

  [data-theme="dark"] .profile-name,
  [data-theme="dark"] .section-title,
  [data-theme="dark"] .stat-num,
  [data-theme="dark"] .service-name,
  [data-theme="dark"] .share-title,
  [data-theme="dark"] .portfolio-card-title,
  html.dark .profile-name,
  html.dark .section-title,
  html.dark .stat-num,
  html.dark .service-name,
  html.dark .share-title,
  html.dark .portfolio-card-title {
    color: #f8fafc !important;
  }

  [data-theme="dark"] .stat-num,
  [data-theme="dark"] .profile-title,
  [data-theme="dark"] .service-price,
  [data-theme="dark"] .url-text,
  html.dark .stat-num,
  html.dark .profile-title,
  html.dark .service-price,
  html.dark .url-text {
    color: #00f0ff !important;
  }

  [data-theme="dark"] .profile-handle,
  [data-theme="dark"] .profile-bio,
  [data-theme="dark"] .meta-item,
  [data-theme="dark"] .stat-lbl,
  [data-theme="dark"] .service-desc,
  [data-theme="dark"] .share-sub,
  html.dark .profile-handle,
  html.dark .profile-bio,
  html.dark .meta-item,
  html.dark .stat-lbl,
  html.dark .service-desc,
  html.dark .share-sub {
    color: #94a3b8 !important;
  }

  [data-theme="dark"] .stat-cell,
  [data-theme="dark"] .service-card,
  [data-theme="dark"] .share-card,
  [data-theme="dark"] .portfolio-card,
  html.dark .stat-cell,
  html.dark .service-card,
  html.dark .share-card,
  html.dark .portfolio-card {
    background: rgba(22, 22, 24, 0.8) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    box-shadow: none !important;
  }

  [data-theme="dark"] .btn-ghost,
  [data-theme="dark"] .btn-icon,
  [data-theme="dark"] .social-link,
  html.dark .btn-ghost,
  html.dark .btn-icon,
  html.dark .social-link {
    background: rgba(255, 255, 255, 0.05) !important;
    color: #f8fafc !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    box-shadow: none !important;
  }

  [data-theme="dark"] .btn-primary,
  html.dark .btn-primary {
    background: linear-gradient(135deg, #00f0ff 0%, #00c8e0 100%) !important;
    color: #001f22 !important;
    box-shadow: 0 0 18px rgba(0, 240, 255, 0.4) !important;
  }

  [data-theme="dark"] .url-display,
  html.dark .url-display {
    background: rgba(0, 0, 0, 0.4) !important;
    border: 1px solid rgba(0, 240, 255, 0.2) !important;
    box-shadow: none !important;
  }
</style>
</head>
<body>

<!-- ── CamCrew header ── -->
<div id="site-header"></div>
<script src="/static/js/header-loader.js"></script>

<!-- ── Main ── -->
<main id="profile-root">

  <!-- Loading skeleton -->
  <div id="skeleton">
    <div class="skel-banner"></div>
    <div class="fixed inset-0 z-[-1] pointer-events-none"><div class="hero-grid absolute inset-0 opacity-15"></div><div class="orb-1"></div><div class="orb-2"></div></div>
    <div class="page-wrap relative z-10">
      <div style="display:flex;align-items:flex-end;gap:1.25rem;margin-top:-52px;margin-bottom:1.25rem;flex-wrap:wrap;">
        <div class="skel" style="width:110px;height:110px;border-radius:50%;flex-shrink:0;border:4px solid #e0e5ec;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:0.6rem;padding-bottom:0.5rem;">
          <div class="skel" style="height:1.8rem;max-width:200px;"></div>
          <div class="skel" style="height:0.9rem;max-width:140px;"></div>
        </div>
      </div>
      <div class="skel" style="height:3.5rem;border-radius:1rem;margin-bottom:2rem;"></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:1rem;overflow:hidden;">
        <div class="skel" style="aspect-ratio:1;"></div>
        <div class="skel" style="aspect-ratio:1;"></div>
        <div class="skel" style="aspect-ratio:1;"></div>
      </div>
    </div>
  </div>

  <!-- Content (hidden until loaded) -->
  <div id="profile-content" style="display:none;"></div>

</main>

<!-- ── Lightbox ── -->
<div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
  <div class="lightbox-inner" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()">
      <span class="material-symbols-outlined">close</span>
    </button>
    <div id="lightbox-content"></div>
  </div>
</div>

<!-- ── Toast ── -->
<div id="pp-toast"></div>

<!-- ── Footer ── -->
<div id="site-footer"></div>
<script src="/static/js/footer-loader.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   State & bootstrap
═══════════════════════════════════════════════════════════════════ */
const S = { user: null, pro: null, username: null };

(async function boot() {
  // Theme — Default to Light Theme
  const theme = localStorage.getItem('cc-theme') || 'light';
  document.documentElement.className = theme;
  document.documentElement.setAttribute('data-theme', theme);

  // Load vault for portfolio count
  let vaultFiles = [];
  try {
    const v = JSON.parse(localStorage.getItem('pro_vault') || '{"files":[]}');
    vaultFiles = v.files || [];
  } catch (_) {}

  // Load jobs for completed count
  let jobs = [];
  try { jobs = JSON.parse(localStorage.getItem('pro_jobs') || '[]'); } catch (_) {}

  // 1. Instant Paint from localStorage cache
  try {
    const cachedPro = localStorage.getItem('cc_pro_profile');
    const cachedUser = localStorage.getItem('cc_user');
    if (cachedPro) S.pro = JSON.parse(cachedPro);
    if (cachedUser) S.user = JSON.parse(cachedUser);
    if (S.pro || S.user) {
      S.username = S.pro?.username || '';
      render(vaultFiles, jobs);
    }
  } catch (_) {}

  // 2. Parallel Async API Fetching (50% Faster Load Time)
  try {
    const [meRes, proRes] = await Promise.all([
      fetch('/api/me', { credentials: 'include' }).catch(() => null),
      fetch('/api/profile', { credentials: 'include' }).catch(() => null)
    ]);

    if (meRes && meRes.ok) {
      const meData = await meRes.json();
      if (meData.ok && meData.user) {
        S.user = meData.user;
        try { localStorage.setItem('cc_user', JSON.stringify(meData.user)); } catch (_) {}
      }
    }

    if (proRes && proRes.ok) {
      const proData = await proRes.json();
      if (proData.ok && proData.profile) {
        S.pro = proData.profile;
        S.username = proData.profile.username || '';
        try { localStorage.setItem('cc_pro_profile', JSON.stringify(proData.profile)); } catch (_) {}
      }
    }
  } catch (err) {
    console.warn('Profile sync warning:', err);
  }

  // 3. Render fresh server data
  render(vaultFiles, jobs);
})();

/* ═══════════════════════════════════════════════════════════════════
   Render
═══════════════════════════════════════════════════════════════════ */
function render(vaultFiles, jobs) {
  const skeleton = document.getElementById('skeleton');
  const content  = document.getElementById('profile-content');

  const displayName  = S.user?.display_name || S.pro?.name || (S.user?.email?.split('@')[0]) || 'Professional';
  const title        = S.pro?.title        || '';
  const bio          = S.pro?.bio          || '';
  const categories   = S.pro?.categories   || [];
  const services     = S.pro?.services     || [];
  const locations    = S.pro?.locations    || [];
  const portfolio    = S.pro?.portfolio    || [];
  const socials      = S.pro?.socials      || {};
  const website      = S.pro?.website      || '';
  const joinedAt     = S.user?.created_at  || S.pro?.savedAt || '';

  const totalPortfolio = portfolio.length || vaultFiles.filter(f => ['image','video'].includes(f.type)).length;
  const completedJobs  = jobs.filter(j => j.status === 'completed').length;
  const initial        = displayName.charAt(0).toUpperCase();

  const avatarPhoto = S.pro?.avatar_url || S.pro?.avatarUrl || S.pro?.photo || S.user?.avatar_url || null;
  const avatarHTML  = avatarPhoto
    ? `<img src="${esc(avatarPhoto)}" alt="${esc(displayName)}" onerror="this.style.display='none';"/><span>${initial}</span>`
    : `<span>${initial}</span>`;

  const memberSince = joinedAt
    ? new Date(joinedAt).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
    : '';

  /* ─ Portfolio grid ─ */
  const allMedia  = portfolio.length ? portfolio : vaultFiles.filter(f => ['image','video'].includes(f.type));
  const gridCells = allMedia.length
    ? allMedia.map((item, i) => {
        const isVideo = item.file_type === 'video' || item.type === 'video' || item.isVideo;
        const url     = item.file_url || item.fileUrl || item.url || '';
        const title   = item.title || item.name || `Portfolio Item #${i+1}`;
        const itemId  = item.id || null;

        if (!url) {
          return `<div class="portfolio-card">
            <div class="portfolio-media-wrap">
              <div class="flex items-center justify-center h-full text-slate-400">
                <span class="material-symbols-outlined text-[32px]">${isVideo ? 'movie' : 'image'}</span>
              </div>
            </div>
          </div>`;
        }

        return `<div class="portfolio-card" id="portfolio-card-${i}">
          <div class="portfolio-media-wrap" onclick="openLightbox(${i})">
            ${isVideo
              ? `<video src="${esc(url)}" muted playsinline preload="metadata" onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0" onerror="this.parentElement.style.display='none'"></video>`
              : `<img src="${esc(url)}" alt="${esc(title)}" loading="lazy"/>`}
          </div>

          <!-- 3-Dot Manage Button -->
          <button class="manage-menu-btn" title="Manage item" onclick="toggleManageMenu(${i}, event)">
            <span class="material-symbols-outlined text-lg">more_vert</span>
          </button>

          <!-- Floating Dropdown Menu -->
          <div class="manage-dropdown" id="manage-menu-${i}">
            <button class="manage-item" onclick="openEditTitleModal('${itemId || ''}', '${esc(title).replace(/'/g, "\\'")}', ${i}, event)">
              <span class="material-symbols-outlined">edit</span> Change Name
            </button>
            <button class="manage-item" onclick="openLightbox(${i}); toggleManageMenu(${i}, event);">
              <span class="material-symbols-outlined">${isVideo ? 'play_circle' : 'visibility'}</span> Preview
            </button>
            <button class="manage-item" onclick="copyMediaLink('${esc(url)}', event); toggleManageMenu(${i}, event);">
              <span class="material-symbols-outlined">link</span> Copy Link
            </button>
            <button class="manage-item danger" onclick="deletePortfolioItem('${itemId || ''}', ${i}, event)">
              <span class="material-symbols-outlined">delete</span> Delete Image
            </button>
          </div>

          <div class="portfolio-card-info">
            <span class="portfolio-card-title">${esc(title)}</span>
            <span class="portfolio-card-badge">${isVideo ? 'VIDEO' : 'IMAGE'}</span>
          </div>
        </div>`;
      }).join('')
    : `<div class="p-12 text-center col-span-full rounded-2xl" style="background:#e0e5ec;box-shadow:inset 3px 3px 8px #b8c2cc, inset -3px -3px 8px #ffffff;">
        <span class="material-symbols-outlined text-4xl text-slate-400 block mb-2">photo_library</span>
        <p class="font-bold text-sm text-slate-600 mb-2">No portfolio items uploaded yet.</p>
        <a href="professional-edit.html" class="inline-flex items-center gap-1 font-extrabold text-xs uppercase tracking-wider text-teal-700 hover:underline">
          Set up profile →
        </a>
      </div>`;

  /* ─ Services ─ */
  const servicesHTML = services.length
    ? `<div class="services-grid">
        ${services.map(s => `
          <div class="service-card">
            <div class="service-icon">
              <span class="material-symbols-outlined">camera</span>
            </div>
            <p class="service-name">${esc(s.name)}</p>
            ${s.price ? `<p class="service-price"><span class="material-symbols-outlined" style="font-size:0.85rem;">currency_rupee</span>${fmtPrice(s)}</p>` : ''}
            ${s.desc  ? `<p class="service-desc">${esc(s.desc)}</p>` : ''}
          </div>`).join('')}
       </div>`
    : `<div class="p-8 text-center rounded-2xl" style="background:#e0e5ec;box-shadow:inset 3px 3px 8px #b8c2cc, inset -3px -3px 8px #ffffff;">
        <p class="font-bold text-xs uppercase tracking-wider text-slate-500 mb-1">No services listed yet.</p>
        <a href="professional-edit.html" class="font-extrabold text-xs text-teal-700 hover:underline">Add services →</a>
       </div>`;

  /* ─ Social links ─ */
  const socialDefs = [
    { key: 'instagram', icon: 'camera_alt',  label: 'Instagram', prefix: 'https://instagram.com/' },
    { key: 'facebook',  icon: 'thumb_up',    label: 'Facebook',  prefix: 'https://facebook.com/'  },
    { key: 'tiktok',    icon: 'music_video', label: 'TikTok',    prefix: 'https://tiktok.com/@'   },
  ];
  const socialsHTML = socialDefs
    .filter(d => socials[d.key])
    .map(d => `
      <a href="${socials[d.key].startsWith('http') ? esc(socials[d.key]) : esc(d.prefix + socials[d.key])}"
         target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="material-symbols-outlined">${d.icon}</span>${d.label}
      </a>`).join('');

  /* ─ Meta row items ─ */
  const metaItems = [];
  if (website) {
    const cleanUrl = website.startsWith('http') ? website : 'https://' + website;
    metaItems.push(`<a href="${esc(cleanUrl)}" target="_blank" rel="noopener noreferrer" class="meta-item link">
      <span class="material-symbols-outlined">link</span>
      ${esc(website.replace(/^https?:\/\//, ''))}
    </a>`);
  }
  if (memberSince) {
    metaItems.push(`<span class="meta-item">
      <span class="material-symbols-outlined">calendar_month</span>
      Joined ${memberSince}
    </span>`);
  }

  const publicShareUrl = S.username
    ? `${window.location.origin}/@${S.username}`
    : `${window.location.origin}/public-profile.html${(S.pro?.user_id || S.user?.id) ? '?id=' + (S.pro?.user_id || S.user?.id) : ''}`;

  /* ─ Render ─ */
  content.innerHTML = `
    <!-- Cover Banner -->
    <div class="profile-banner">
      <div class="banner-lines"></div>
      <div class="banner-glow-left"></div>
      <div class="banner-glow-right"></div>
    </div>

    <!-- Identity Block -->
    <div class="page-wrap relative z-10">
      <div class="identity-block">
        <!-- Avatar row -->
        <div class="avatar-positioner">
          <div class="avatar-ring">${avatarHTML}</div>
          <div class="avatar-actions">
            <a href="index.html" class="btn-ghost" title="Go to Home">
              <span class="material-symbols-outlined text-sm">home</span>
              Home
            </a>
            <a href="professional-dashboard.html" class="btn-primary">
              <span class="material-symbols-outlined text-sm">dashboard</span>
              Dashboard
            </a>
            <a href="professional-edit.html" class="btn-ghost">
              <span class="material-symbols-outlined text-sm">edit</span>
              Edit Profile
            </a>
          </div>
        </div>

        <!-- Name & title -->
        <h1 class="profile-name">
          ${esc(displayName)}
          <span class="pro-badge">
            <span class="material-symbols-outlined text-xs">verified</span>
            Pro
          </span>
        </h1>
        ${S.username ? `<p class="profile-handle">@${esc(S.username)}</p>` : ''}
        ${title ? `<p class="profile-title">
          <span class="material-symbols-outlined text-base">photo_camera</span>
          ${esc(title)}
        </p>` : ''}

        ${bio ? `<p class="profile-bio">${esc(bio)}</p>` : ''}

        ${metaItems.length ? `<div class="meta-row">${metaItems.join('')}</div>` : ''}

        ${categories.length ? `<div class="chips-row">
          ${categories.map(c => `<span class="chip">${esc(c)}</span>`).join('')}
        </div>` : ''}

        ${locations.length ? `<div class="chips-row">
          ${locations.map(l => `<span class="chip chip-location">
            <span class="material-symbols-outlined text-xs">location_on</span>${esc(l)}
          </span>`).join('')}
        </div>` : ''}

        ${socialsHTML ? `<div class="socials-row">${socialsHTML}</div>` : ''}
      </div>

      <!-- Stats Strip -->
      <div class="stats-strip">
        <div class="stat-cell">
          <span class="stat-num">${totalPortfolio}</span>
          <span class="stat-lbl">Portfolio Items</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${services.length}</span>
          <span class="stat-lbl">Active Services</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${completedJobs}</span>
          <span class="stat-lbl">Jobs Completed</span>
        </div>
        <div class="stat-cell">
          <span class="stat-num">${locations.length}</span>
          <span class="stat-lbl">Service Cities</span>
        </div>
      </div>

      <!-- Portfolio Section -->
      <div class="section-head">
        <h2 class="section-title">Portfolio Showcase</h2>
        ${allMedia.length ? `<span class="text-xs font-bold uppercase tracking-wider text-slate-500">${allMedia.length} item${allMedia.length !== 1 ? 's' : ''}</span>` : ''}
      </div>
      <div class="portfolio-grid" id="portfolio-grid">${gridCells}</div>

      <!-- Services Section -->
      <div class="section-head">
        <h2 class="section-title">Services &amp; Pricing</h2>
      </div>
      ${servicesHTML}

      <!-- Share Profile Section -->
      <div class="section-head">
        <h2 class="section-title">Share Public Profile</h2>
      </div>
      <div class="share-card">
        <div class="share-card-top flex items-center justify-between gap-4 flex-wrap">
          <div>
            <p class="share-title">Your Public Profile Link</p>
            <p class="share-sub">Share with prospective clients — no login required to view your portfolio &amp; services.</p>
          </div>
          <button onclick="copyProfileLink()" class="btn-primary">
            <span class="material-symbols-outlined text-sm">content_copy</span>
            Copy Link
          </button>
        </div>
        <div class="url-display">
          <span class="material-symbols-outlined">link</span>
          <span class="url-text">${esc(publicShareUrl)}</span>
        </div>
      </div>

    </div><!-- /page-wrap -->
  `;

  window._lightboxMedia = allMedia;
  skeleton.style.display = 'none';
  content.style.display  = 'block';
}

/* ═══════════════════════════════════════════════════════════════════
   Lightbox
═══════════════════════════════════════════════════════════════════ */
function openLightbox(idx) {
  const media = (window._lightboxMedia || [])[idx];
  if (!media || !media.url) return;
  const url = media.url;
  const isInstagram = url.includes('instagram.com');
  const isEmbed = url.includes('youtube.com/embed') || url.includes('player.vimeo.com') || isInstagram;
  const isVideo = media.type === 'video' || media.isVideo;
  const lb = document.getElementById('lightbox-content');
  if (isEmbed) {
    if (isInstagram) {
      lb.innerHTML = `
        <div style="position:relative;width:min(340px,90vw);max-height:90vh;border-radius:0.85rem;overflow:hidden;">
          <iframe src="${esc(url)}" frameborder="0" scrolling="no"
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
            allowfullscreen
            style="position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:0.85rem;">
          </iframe>
          <div style="padding-top:177.78%;"></div>
        </div>`;
    } else {
      lb.innerHTML = `
        <div style="position:relative;width:min(850px,90vw);border-radius:0.85rem;overflow:hidden;">
          <iframe src="${esc(url)}" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            style="position:absolute;inset:0;width:100%;height:100%;border:none;">
          </iframe>
          <div style="padding-top:56.25%;"></div>
        </div>`;
    }
  } else if (isVideo) {
    lb.innerHTML = `<video src="${esc(url)}" controls autoplay style="width:100%;max-height:82vh;border-radius:0.85rem;"></video>`;
  } else {
    lb.innerHTML = `<img src="${esc(url)}" alt="Portfolio" style="width:100%;max-height:82vh;object-fit:contain;border-radius:0.85rem;"/>`;
  }
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

/* ═══════════════════════════════════════════════════════════════════
   Copy profile link
═══════════════════════════════════════════════════════════════════ */
function copyProfileLink() {
  const url = S.username
    ? window.location.origin + '/@' + S.username
    : window.location.origin + '/public-profile.html' + ((S.pro?.user_id || S.user?.id) ? '?id=' + (S.pro?.user_id || S.user?.id) : '');
  navigator.clipboard.writeText(url)
    .then(() => showToast('Link copied to clipboard'))
    .catch(() => showToast('Could not copy link.'));
}

/* ═══════════════════════════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtPrice(s) {
  if (!s.price) return '';
  const unit = s.unit || 'project';
  const num  = Number(s.price).toLocaleString('en-IN');
  return `${num} / ${unit}`;
}

function showToast(msg) {
  const t = document.getElementById('pp-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function toggleTheme() {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  document.documentElement.className = next;
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('cc-theme', next);
}

/* ═══════════════════════════════════════════════════════════════════
   Portfolio Item Deletion & Title Editing Handlers
═══════════════════════════════════════════════════════════════════ */
function toggleManageMenu(index, event) {
  if (event) event.stopPropagation();
  const allMenus = document.querySelectorAll('.manage-dropdown');
  allMenus.forEach((m, idx) => {
    if (idx !== index) m.classList.remove('active');
  });
  const menu = document.getElementById(`manage-menu-${index}`);
  if (menu) menu.classList.toggle('active');
}

document.addEventListener('click', () => {
  document.querySelectorAll('.manage-dropdown').forEach(m => m.classList.remove('active'));
});

function copyMediaLink(url, event) {
  if (event) event.stopPropagation();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('Image link copied to clipboard!'));
  } else {
    showToast('Image link copied!');
  }
}

async function deletePortfolioItem(itemId, itemIndex, event) {
  if (event) event.stopPropagation();
  toggleManageMenu(itemIndex, event);
  if (!confirm('Are you sure you want to delete this portfolio item?')) return;

  const card = document.getElementById(`portfolio-card-${itemIndex}`);
  if (card) {
    card.style.opacity = '0.3';
    card.style.pointerEvents = 'none';
  }

  const media = (window._lightboxMedia || [])[itemIndex] || {};
  const targetId = itemId || media.id;
  const targetUrl = media.file_url || media.fileUrl || media.url;

  try {
    let res;
    if (targetId && String(targetId).match(/^\d+$/)) {
      res = await fetch(`/api/portfolio/${targetId}`, { method: 'DELETE' });
    } else if (targetUrl) {
      res = await fetch('/api/portfolio', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_url: targetUrl })
      });
    } else {
      throw new Error('Item identifier missing.');
    }

    const data = await res.json();
    if (data.ok) {
      if (card) card.remove();
      try { localStorage.removeItem('cc_pro_profile'); } catch(_) {}
      showToast('Portfolio item deleted successfully');
    } else {
      if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
      showToast(data.error || 'Failed to delete item');
    }
  } catch (err) {
    console.error('Delete portfolio error:', err);
    if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
    showToast('Failed to delete portfolio item');
  }
}

let _editingItem = null;

function openEditTitleModal(itemId, currentTitle, cardIndex, event) {
  if (event) event.stopPropagation();
  toggleManageMenu(cardIndex, event);
  _editingItem = { id: itemId, index: cardIndex };
  const input = document.getElementById('edit-title-input');
  if (input) input.value = currentTitle || '';
  const modal = document.getElementById('edit-title-modal');
  if (modal) modal.style.display = 'flex';
}

function closeEditTitleModal() {
  const modal = document.getElementById('edit-title-modal');
  if (modal) modal.style.display = 'none';
  _editingItem = null;
}

async function savePortfolioTitle() {
  if (!_editingItem) return;
  const input = document.getElementById('edit-title-input');
  const newTitle = input ? input.value.trim() : '';
  if (!newTitle) { showToast('Please enter a title'); return; }

  const btn = document.getElementById('save-title-btn');
  if (btn) btn.disabled = true;

  try {
    const res = await fetch(`/api/portfolio/${_editingItem.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: newTitle })
    });
    const data = await res.json();
    if (data.ok) {
      const titleEl = document.querySelector(`#portfolio-card-${_editingItem.index} .portfolio-card-title`);
      if (titleEl) titleEl.textContent = newTitle;
      showToast('Image name updated successfully!');
      closeEditTitleModal();
    } else {
      showToast(data.error || 'Failed to update title');
    }
  } catch (err) {
    console.error('Update title error:', err);
    showToast('Failed to update image name');
  } finally {
    if (btn) btn.disabled = false;
  }
}
</script>

<!-- Edit Title Modal -->
<div id="edit-title-modal" style="display:none;position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);align-items:center;justify-content:center;">
  <div style="background:#e0e5ec;border:1px solid rgba(0,0,0,0.1);border-radius:1.25rem;padding:1.75rem;width:90%;max-width:420px;box-shadow:8px 8px 24px #b8c2cc, -8px -8px 24px #ffffff;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <h3 style="font-size:1.1rem;font-weight:900;color:#0f172a;">Change Image Name</h3>
      <button onclick="closeEditTitleModal()" style="background:none;border:none;color:#475569;cursor:pointer;"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div style="margin-bottom:1.25rem;">
      <label style="display:block;font-size:0.75rem;font-weight:800;color:#475569;text-transform:uppercase;margin-bottom:0.4rem;">New Title / Name</label>
      <input type="text" id="edit-title-input" class="cc-input" style="width:100%;padding:0.75rem 1rem;border-radius:0.75rem;background:#e0e5ec;border:none;box-shadow:inset 3px 3px 6px #b8c2cc, inset -3px -3px 6px #ffffff;color:#0f172a;font-size:0.9rem;font-weight:700;" placeholder="Enter image title…"/>
    </div>
    <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
      <button onclick="closeEditTitleModal()" class="btn-ghost">Cancel</button>
      <button id="save-title-btn" onclick="savePortfolioTitle()" class="btn-primary">Save Name</button>
    </div>
  </div>
</div>

</body>
</html>
