<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script>
    (function(){
      const t = localStorage.getItem('cc-theme') || 'dark';
      document.documentElement.className = t;
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Camcrew Studio</title>
  <meta name="description" content="View and manage your account notifications, order status updates, booking requests, and rental alerts.">
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <!-- Tailwind CSS & Site Styles -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/static/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/static/css/styles.css">
  
  <style>
    [data-theme="light"] body,
    html.light body {
      background-color: #e0e5ec !important;
      color: #0f172a !important;
    }
    [data-theme="light"] .glass-panel,
    html.light .glass-panel {
      background: #e0e5ec !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      box-shadow: 4px 4px 10px #b8c2cc, -4px -4px 10px #ffffff !important;
      color: #0f172a !important;
    }
    [data-theme="light"] .text-on-surface,
    html.light .text-on-surface {
      color: #0f172a !important;
    }
    [data-theme="light"] .text-on-surface-variant,
    html.light .text-on-surface-variant {
      color: #475569 !important;
    }
    :root { --cyan:#00dbe9; --violet:#ebb2ff; --ink:#0A0A0B; --muted:#b9cacb; }
    body {
      background-color: #0A0A0B;
      color: #e4e8f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-panel {
      background: rgba(18, 20, 28, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.2);
      border-radius: 999px;
    }
    .tab-btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: rgba(0, 240, 255, 0.5);
      color: #00f0ff;
      font-weight: 700;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pt-24 font-body-md antialiased">

  <!-- Shared Header Container (Identical to index.html) -->
  <div id="site-header"></div>

  <!-- Main Notifications Container -->
  <main class="max-w-5xl mx-auto px-4 md:px-8 py-8 w-full flex-1 relative z-10">
    
    <!-- Title & Top Summary Bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-primary text-3xl">notifications</span>
          <h1 class="text-2xl md:text-3xl font-extrabold text-on-surface tracking-tight">Notifications</h1>
          <span id="page-unread-count" class="bg-primary/20 text-primary border border-primary/40 font-bold text-xs px-3 py-1 rounded-full">0 Unread</span>
        </div>
        <p class="text-on-surface-variant text-sm mt-1">Manage your order updates, booking inquiries, rental alerts, and verification status.</p>
      </div>

      <!-- Action Controls -->
      <div class="flex items-center gap-3">
        <button onclick="pageMarkAllRead()" class="flex items-center gap-2 px-4 py-2 rounded-xl glass-panel text-xs font-semibold text-primary hover:border-primary/50 transition-all">
          <span class="material-symbols-outlined text-sm">done_all</span>
          Mark All Read
        </button>
        <button onclick="pageDeleteRead()" class="flex items-center gap-2 px-4 py-2 rounded-xl glass-panel text-xs font-semibold text-on-surface-variant hover:text-red-400 hover:border-red-500/40 transition-all">
          <span class="material-symbols-outlined text-sm">delete_sweep</span>
          Clear Read
        </button>
      </div>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="glass-panel rounded-2xl p-4 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- Filter Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar w-full md:w-auto pb-2 md:pb-0">
        <button onclick="setFilterTab('all')" id="tab-all" class="tab-btn active px-4 py-2 rounded-xl text-xs font-medium border border-glass-stroke text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">
          All
        </button>
        <button onclick="setFilterTab('unread')" id="tab-unread" class="tab-btn px-4 py-2 rounded-xl text-xs font-medium border border-glass-stroke text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">
          Unread
        </button>
        <button onclick="setFilterTab('order')" id="tab-order" class="tab-btn px-4 py-2 rounded-xl text-xs font-medium border border-glass-stroke text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">
          Orders
        </button>
        <button onclick="setFilterTab('booking')" id="tab-booking" class="tab-btn px-4 py-2 rounded-xl text-xs font-medium border border-glass-stroke text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">
          Bookings
        </button>
        <button onclick="setFilterTab('rental')" id="tab-rental" class="tab-btn px-4 py-2 rounded-xl text-xs font-medium border border-glass-stroke text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">
          Rentals
        </button>
        <button onclick="setFilterTab('verification')" id="tab-verification" class="tab-btn px-4 py-2 rounded-xl text-xs font-medium border border-glass-stroke text-on-surface-variant hover:text-on-surface transition-all whitespace-nowrap">
          Verifications
        </button>
      </div>

      <!-- Search Input -->
      <div class="relative w-full md:w-64">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
        <input type="text" id="notif-search" oninput="renderPageNotifications()" placeholder="Filter notifications..." class="w-full bg-obsidian-base/60 border border-glass-stroke rounded-xl pl-9 pr-4 py-2 text-xs text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:border-primary/50 transition-all">
      </div>

    </div>

    <!-- Notification Feed Container -->
    <div id="page-notif-feed" class="flex flex-col gap-3 mb-12">
      <!-- Loading Skeleton -->
      <div class="glass-panel rounded-2xl p-6 text-center text-on-surface-variant text-sm">
        <span class="material-symbols-outlined text-3xl animate-spin text-primary">sync</span>
        <p class="mt-2">Loading notifications...</p>
      </div>
    </div>

  </main>

  <!-- Shared Footer Container (Identical to index.html) -->
  <div id="site-footer"></div>

  <!-- Standard Header & Footer Loaders (Identical to index.html) -->
  <script src="/static/js/header-loader.js"></script>
  <script src="/static/js/footer-loader.js"></script>

  <!-- Notification Page Controller JS -->
  <script>
    let allNotifications = [];
    let currentFilterTab = 'all';

    async function loadNotificationsPage() {
      try {
        const res = await fetch('/api/notifications?limit=100');
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = 'signin.html';
            return;
          }
          throw new Error("Failed to fetch notifications");
        }
        const data = await res.json();
        if (!data.ok) return;

        allNotifications = data.notifications || [];
        updatePageUnreadBadge(data.unread_count || 0);
        renderPageNotifications();
      } catch (e) {
        document.getElementById('page-notif-feed').innerHTML = `
          <div class="glass-panel rounded-2xl p-8 text-center text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl text-red-400">error</span>
            <p class="mt-2 font-bold text-on-surface">Unable to load notifications</p>
            <p class="text-xs mt-1">Please check your network connection and try again.</p>
          </div>`;
      }
    }

    function updatePageUnreadBadge(count) {
      const badge = document.getElementById('page-unread-count');
      if (badge) badge.textContent = `${count} Unread`;
    }

    function setFilterTab(tab) {
      currentFilterTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');
      renderPageNotifications();
    }

    function renderPageNotifications() {
      const feed = document.getElementById('page-notif-feed');
      const searchQuery = (document.getElementById('notif-search').value || '').toLowerCase().trim();

      let filtered = allNotifications.filter(n => {
        // Tab filter
        if (currentFilterTab === 'unread' && n.is_read) return false;
        if (currentFilterTab !== 'all' && currentFilterTab !== 'unread' && n.type !== currentFilterTab) return false;
        
        // Search query filter
        if (searchQuery) {
          const matchTitle = (n.title || '').toLowerCase().includes(searchQuery);
          const matchMsg = (n.message || '').toLowerCase().includes(searchQuery);
          if (!matchTitle && !matchMsg) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        feed.innerHTML = `
          <div class="glass-panel rounded-2xl p-12 text-center text-on-surface-variant flex flex-col items-center">
            <span class="material-symbols-outlined text-5xl text-primary/40 mb-3">notifications_none</span>
            <h3 class="text-base font-bold text-on-surface">No notifications found</h3>
            <p class="text-xs text-on-surface-variant/70 mt-1">There are no notification alerts matching your current filter.</p>
          </div>`;
        return;
      }

      const typeIcons = {
        'order': 'shopping_bag',
        'booking': 'calendar_today',
        'rental': 'photo_camera',
        'verification': 'verified',
        'info': 'info'
      };

      const typeColors = {
        'order': 'text-cyan-400 bg-cyan-500/10 border-cyan-500/20',
        'booking': 'text-purple-400 bg-purple-500/10 border-purple-500/20',
        'rental': 'text-amber-400 bg-amber-500/10 border-amber-500/20',
        'verification': 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20',
        'info': 'text-blue-400 bg-blue-500/10 border-blue-500/20'
      };

      feed.innerHTML = filtered.map(n => {
        const icon = typeIcons[n.type] || 'notifications';
        const colorStyle = typeColors[n.type] || 'text-primary bg-primary/10 border-primary/20';
        const unreadCardStyle = !n.is_read ? 'bg-charcoal-surface/80 border-primary/40 shadow-[0_4px_20px_rgba(0,240,255,0.05)]' : 'bg-charcoal-surface/40 border-glass-stroke opacity-85';
        const unreadDot = !n.is_read ? '<span class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse shadow-[0_0_8px_#00f0ff]"></span>' : '';
        const linkBtn = n.link ? `<a href="${n.link}" onclick="pageMarkRead(${n.id})" class="text-xs font-bold text-primary hover:underline flex items-center gap-1"><span>View details</span><span class="material-symbols-outlined text-xs">arrow_forward</span></a>` : '';

        return `
          <div class="glass-panel ${unreadCardStyle} rounded-2xl p-4 md:p-5 transition-all hover:border-primary/50 flex items-start gap-4">
            <div class="p-3 rounded-xl border ${colorStyle} flex-shrink-0 mt-0.5">
              <span class="material-symbols-outlined text-lg">${icon}</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                  <h3 class="font-bold text-sm md:text-base text-on-surface truncate">${n.title}</h3>
                  ${unreadDot}
                </div>
                <span class="text-[10px] md:text-xs text-on-surface-variant/60 whitespace-nowrap">${n.created_at || ''}</span>
              </div>
              <p class="text-xs md:text-sm text-on-surface-variant mt-1 leading-relaxed">${n.message}</p>
              <div class="flex items-center justify-between mt-3 pt-2 border-t border-glass-stroke/50">
                <div>${linkBtn}</div>
                <div class="flex items-center gap-2">
                  ${!n.is_read ? `<button onclick="pageMarkRead(${n.id})" class="text-[11px] text-on-surface-variant hover:text-primary transition-colors px-2 py-1 rounded-lg hover:bg-white/5">Mark read</button>` : ''}
                  <button onclick="pageDeleteNotif(${n.id})" class="text-[11px] text-on-surface-variant hover:text-red-400 transition-colors p-1" title="Delete notification">
                    <span class="material-symbols-outlined text-sm">delete</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function pageMarkRead(id) {
      try {
        await fetch(`/api/notifications/${id}/read`, { method: 'PATCH' });
        loadNotificationsPage();
      } catch (e) {}
    }

    async function pageMarkAllRead() {
      try {
        await fetch('/api/notifications/mark-all-read', { method: 'POST' });
        loadNotificationsPage();
      } catch (e) {}
    }

    async function pageDeleteNotif(id) {
      try {
        await fetch(`/api/notifications/${id}`, { method: 'DELETE' });
        loadNotificationsPage();
      } catch (e) {}
    }

    async function pageDeleteRead() {
      const readNotifs = allNotifications.filter(n => n.is_read);
      for (const n of readNotifs) {
        try {
          await fetch(`/api/notifications/${n.id}`, { method: 'DELETE' });
        } catch (e) {}
      }
      loadNotificationsPage();
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadNotificationsPage();
    });
  </script>

</body>
</html>
